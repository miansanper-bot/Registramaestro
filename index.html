<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RegistrAula</title>
<meta name="theme-color" content="#1c5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RegistrAula">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#f0efec; --ink:#1b1b1a; --ink2:#52514e; --muted:#8a8983;
  --line:#e4e2dc; --primary:#1c5cab; --primary-ink:#ffffff;
  --pos:#2a78d6; --pos-soft:#cde2fb; --neg:#e34948; --neg-soft:#fbdada; --neu:#6b6a65; --neu-soft:#ebeae6;
  --sel:#1b1b1a; --sel-ink:#ffffff; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1d1d1b; --surface2:#262624; --ink:#f3f2ee; --ink2:#c3c2b7; --muted:#8f8e86;
    --line:#34332f; --primary:#3987e5; --primary-ink:#0b0b0b;
    --pos:#3987e5; --pos-soft:#17304f; --neg:#e66767; --neg-soft:#4a2020; --neu:#a3a29b; --neu-soft:#2e2e2b;
    --sel:#f3f2ee; --sel-ink:#121211; --warn-bg:#3a3014; --warn-ink:#f1d58a;
    --shadow:none;
    --l1:#17304f;--l1i:#cde2fb;--l2:#256abf;--l2i:#ffffff;--l3:#5598e7;--l3i:#0b0b0b;--l4:#b7d3f6;--l4i:#0b0b0b;
    --d1:#e66767;--d1i:#0b0b0b;--d2:#4a2020;--d2i:#f6c9c9;--d3:#383835;--d3i:#f3f2ee;--d4:#17304f;--d4i:#cde2fb;--d5:#3987e5;--d5i:#0b0b0b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1d1d1b; --surface2:#262624; --ink:#f3f2ee; --ink2:#c3c2b7; --muted:#8f8e86;
  --line:#34332f; --primary:#3987e5; --primary-ink:#0b0b0b;
  --pos:#3987e5; --pos-soft:#17304f; --neg:#e66767; --neg-soft:#4a2020; --neu:#a3a29b; --neu-soft:#2e2e2b;
  --sel:#f3f2ee; --sel-ink:#121211; --warn-bg:#3a3014; --warn-ink:#f1d58a;
  --shadow:none;
  --l1:#17304f;--l1i:#cde2fb;--l2:#256abf;--l2i:#ffffff;--l3:#5598e7;--l3i:#0b0b0b;--l4:#b7d3f6;--l4i:#0b0b0b;
  --d1:#e66767;--d1i:#0b0b0b;--d2:#4a2020;--d2i:#f6c9c9;--d3:#383835;--d3i:#f3f2ee;--d4:#17304f;--d4i:#cde2fb;--d5:#3987e5;--d5i:#0b0b0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header.top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--surface);border-bottom:1px solid var(--line)}
header.top .brand{font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
header.top .brand span{color:var(--primary)}
@media (max-width:520px){ header.top .clock{display:none} header.top [data-a=syncOpen]{margin-left:auto} }
header.top .clock{margin-left:auto;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:13px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--primary);font-weight:600}
.wrap{padding:16px;max-width:1400px;margin:0 auto}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px;margin:18px 0 8px;color:var(--ink)}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:500}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
label.f > *{font-size:16px;color:var(--ink)}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- AULA ---------- */
.session{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.session .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.session .dot{width:10px;height:10px;border-radius:50%}
.aula{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:820px){.aula{grid-template-columns:1fr}}
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.stu{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:66px;padding:8px 8px 18px;
  text-align:left;font-weight:600;font-size:15px;line-height:1.2;box-shadow:var(--shadow);overflow:hidden}
.stu .sur{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.stu.on .sur{color:inherit;opacity:.75}
.stu .bd{position:absolute;right:6px;bottom:4px;display:flex;gap:4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.stu .bd b{padding:0 5px;border-radius:6px}
.stu .bd .p{background:var(--pos-soft);color:var(--pos)} .stu .bd .n{background:var(--neg-soft);color:var(--neg)}
.stu .bd .s{background:var(--neu-soft);color:var(--ink2)}
.stu.on .bd b{background:rgba(255,255,255,.2);color:inherit}
.panel{position:sticky;top:0}
.catlbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px}
.inds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ind{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-height:52px;padding:6px 10px;text-align:left;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.ind .sg{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:15px}
.ind.p .sg{background:var(--pos-soft);color:var(--pos)} .ind.n .sg{background:var(--neg-soft);color:var(--neg)} .ind.z .sg{background:var(--neu-soft);color:var(--ink2);font-size:11px}
.ind:disabled{opacity:.45}
.ind.pend{outline:2px solid var(--primary);outline-offset:1px}
.picker{border:2px solid var(--primary);border-radius:12px;padding:10px;margin:10px 0;background:var(--surface)}
.picker .vals{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.picker .vals button{min-width:52px;min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-size:20px;font-weight:700}
.feed{margin-top:14px}
.feed .it{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.p{background:var(--pos-soft);color:var(--pos)} .chip.n{background:var(--neg-soft);color:var(--neg)} .chip.z{background:var(--neu-soft);color:var(--ink2)}
.empty{padding:28px;text-align:center;color:var(--ink2)}

/* ---------- LISTAS / TABLAS ---------- */
.list .it{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:active{background:var(--surface2)}
.num{text-align:right}
.subtabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px;padding-bottom:2px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:14px}
.subtabs button.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.sched{width:100%;border-collapse:separate;border-spacing:4px;font-size:13px}
.sched th{color:var(--muted);font-weight:600;padding:4px}
.sched td{vertical-align:top;min-width:90px}
.sched .ss{display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:6px 8px;margin-bottom:3px;color:#fff;font-size:13px;line-height:1.2}
.swatch{width:22px;height:22px;border-radius:6px;display:inline-block;flex:none}

/* ---------- INFORMES ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .l{font-size:13px;color:var(--ink2)} .kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-bottom:14px}
.chart h4{margin:0 0 2px;font-size:15px} .chart .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{fill:var(--ink2);font-size:11px}
.chart svg .axis{stroke:var(--line)}
.chart svg .zero{stroke:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.summary{font-size:15px;line-height:1.55}
.summary li{margin-bottom:4px}
.notes .it{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:8px;max-width:240px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* ---------- MODAL / TOAST ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px}
#modal .box h3{margin-top:0}
#modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  border-radius:12px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
#toast.show{display:flex}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:5px 10px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:42px}
.seg button.on{background:var(--sel);color:var(--sel-ink)}

/* ---------- TAREAS / COMPETENCIAS ---------- */
:root{--l1:#cde2fb;--l2:#86b6ef;--l3:#3987e5;--l4:#1c5cab;--l1i:#0d366b;--l2i:#0d366b;--l3i:#ffffff;--l4i:#ffffff}
.lv{display:flex;gap:5px;flex-wrap:wrap}
.lv button{min-width:48px;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-size:18px;font-weight:700;padding:0 6px}
.lv button.nr{font-size:12px;min-width:44px}
.lv button.on1{background:var(--l1);color:var(--l1i);border-color:var(--l1)} .lv button.on2{background:var(--l2);color:var(--l2i);border-color:var(--l2)}
.lv button.on3{background:var(--l3);color:var(--l3i);border-color:var(--l3)} .lv button.on4{background:var(--l4);color:var(--l4i);border-color:var(--l4)}
.lv button.onNR{background:var(--neu);color:var(--surface);border-color:var(--neu)}
.lv button:disabled{opacity:.4}
.task{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--surface)}
.task .tn{font-weight:600;margin-bottom:6px}
.cc{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--ink2);margin:0 3px 3px 0}
.lvlegend{font-size:12px;color:var(--muted);margin:4px 0 10px}
.evrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.evrow .nm{flex:1;min-width:120px;font-weight:600}
.evrow .nm span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tasktabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tasktabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;font-size:14px}
.tasktabs button.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.tasktabs button small{display:block;font-size:11px;opacity:.7}
.stu .bd .t{background:var(--l1);color:var(--l1i)}
.plan td{min-width:120px}
.plan .ss{position:relative}
.plan .ss .tk{display:block;font-weight:400;font-size:12px;opacity:.9;margin-top:3px}
.plan th.today{color:var(--primary)}
.tree .ce{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.tree label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
.tree label input{width:20px;height:20px;flex:none;margin-top:1px}
.tree .crs{padding-left:26px}
.matrix td.lvc{text-align:center;font-weight:700;border-radius:6px;min-width:44px}
.grade{display:inline-block;min-width:34px;text-align:center;padding:2px 8px;border-radius:8px;font-weight:800;background:var(--surface2)}

/* ---------- PANEL ---------- */
:root{--d1:#e34948;--d1i:#fff;--d2:#fbdada;--d2i:#8a1f1f;--d3:#f0efec;--d3i:#1b1b1a;--d4:#cde2fb;--d4i:#0d366b;--d5:#2a78d6;--d5i:#fff}
.hmap td.hm{text-align:center;font-weight:700;border-radius:6px;min-width:46px;font-variant-numeric:tabular-nums;border-bottom:2px solid var(--surface)}
.hmap th{text-align:center}
.d1{background:var(--d1)!important;color:var(--d1i)!important} .d2{background:var(--d2)!important;color:var(--d2i)!important}
.d3{background:var(--d3)!important;color:var(--d3i)!important} .d4{background:var(--d4)!important;color:var(--d4i)!important}
.d5{background:var(--d5)!important;color:var(--d5i)!important}
.legend i.d1,.legend i.d2,.legend i.d3,.legend i.d4,.legend i.d5{border:1px solid var(--line)}
.warnnum{color:var(--neg);font-weight:800}

/* ---------- IMPRESIÓN ---------- */
.print-only{display:none}
@media print{
  :root{--bg:#fff;--surface:#fff;--shadow:none}
  header.top,nav.tabs,.noprint,#toast{display:none!important}
  #app{display:block;height:auto} main{overflow:visible}
  .print-only{display:block}
  .card,.kpi,.chart{break-inside:avoid}
  body{font-size:12px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Registr<span>Aula</span></div>
    <div class="clock" id="clock"></div>
    <button class="btn sm" data-a="syncOpen" title="Sincronizar con otro dispositivo">⇅ Sincronizar</button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"><span id="toastMsg"></span><span id="toastBtns"></span></div>
<div id="tip"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';
/* =====================================================================
   RegistrAula · registro de aula académico y conductual
   Datos: IndexedDB del propio dispositivo (no salen de la tablet).
   ===================================================================== */

// ---------- Constantes ----------
const CATS = [
  {k:'Conducta', area:'C'},
  {k:'Relación social', area:'C'},
  {k:'Hábitos y autonomía', area:'C'},
  {k:'Participación', area:'A'},
  {k:'Tarea', area:'A'},
  {k:'Evaluación', area:'A'}
];
const AREA = Object.fromEntries(CATS.map(c=>[c.k,c.area]));
const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAYS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const LEVELS = {1:'No conseguido', 2:'En proceso', 3:'Conseguido', 4:'Destacado'};
const GRADES = ['IN','SU','BI','NT','SB'];
const NIVELES = [['I3','Inf. 3 años'],['I4','Inf. 4 años'],['I5','Inf. 5 años'],['1','1.º'],['2','2.º'],['3','3.º'],['4','4.º'],['5','5.º'],['6','6.º']];
const lvLabel = c => (NIVELES.find(n => n[0] === c) || [c, c])[1];
const lvMatch = (arr, lv) => !lv || !arr || !arr.length || arr.includes(lv);
const lvChips = arr => (arr && arr.length) ? arr.slice().sort((a,b)=>NIVELES.findIndex(n=>n[0]===a)-NIVELES.findIndex(n=>n[0]===b)).map(c => `<span class="cc" style="background:var(--l1);color:var(--l1i)">${lvLabel(c)}</span>`).join('') : '';
const lvChecks = (cls, sel, onch='') => `<div class="row small">` + NIVELES.map(([c,l]) => `<label class="row" style="gap:4px"><input type="checkbox" class="${cls}" value="${c}" ${sel && sel.includes(c) ? 'checked' : ''} ${onch} style="width:20px;height:20px"> ${l}</label>`).join('') + `</div>`;
const lvSelect = (dc, cur, allLbl='Todos los niveles') => `<select data-c="${dc}"><option value="">${allLbl}</option>${NIVELES.map(([c,l]) => `<option value="${c}" ${cur===c?'selected':''}>${l}</option>`).join('')}</select>`;
// Niveles efectivos de una tarea: los suyos o, si no tiene, los de sus criterios
function taskLevels(t){
  if ((t.levels||[]).length) return t.levels;
  const set = new Set(); (t.critIds||[]).forEach(id => { const k = byId(state.criterios, id); (k && k.levels || []).forEach(l => set.add(l)); });
  return [...set];
}
const COLLS = ['groups','students','subjects','indicators','schedule','competencias','criterios','tareas','plan'];
const GRADE_L = {IN:'Insuficiente', SU:'Suficiente', BI:'Bien', NT:'Notable', SB:'Sobresaliente'};
const PALETTE = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948','#6b6a65'];

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseYmd = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = ts => { const d = new Date(ts); return `${DAYS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`; };
const fmtNum = (n, dec=1) => (n == null || isNaN(n)) ? '–' : n.toLocaleString('es-ES',{maximumFractionDigits:dec, minimumFractionDigits:dec});
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; };
const byId = (arr, id) => arr.find(x => x.id === id);
const norm = r => (r.mode === 'score' && r.val != null && r.max > r.min) ? (r.val - r.min) / (r.max - r.min) * 10 : null;
const mean = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
const inkOn = hex => { const n = parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255; return (0.299*r+0.587*g+0.114*b) > 150 ? '#1b1b1a' : '#ffffff'; };
const splitName = n => { const p = String(n).trim().split(/\s+/); return {first:p[0]||'', rest:p.slice(1).join(' ')}; };

// Actualiza datos de versiones anteriores sin perder nada
function migrate(s){
  if (!s.v || s.v < 2){
    s.competencias = s.competencias || [];   // {id, subjectId, code, text}
    s.criterios = s.criterios || [];         // {id, compId, code, text}
    s.tareas = s.tareas || [];               // {id, subjectId, name, desc, compIds[], critIds[], active}
    s.plan = s.plan || [];                   // {id, date, gid, subj, start, taskIds[]}
    s.prefs = Object.assign({}, s.prefs || {}, {deselect:false});
    s.v = 2;
  }
  if (s.v < 3){
    (s.criterios||[]).forEach(k => { if (!k.levels) k.levels = []; });
    (s.tareas||[]).forEach(t => { if (!t.levels) t.levels = []; });
    s.tomb = s.tomb || {};   // id → fecha de borrado (para sincronizar borrados)
    s.v = 3;
  }
  s.tomb = s.tomb || {};
  s.prefs = Object.assign({deselect:false, cuts:[2, 2.5, 3, 3.5], device:''}, s.prefs || {});
  return s;
}
// ---------- Currículo y tareas ----------
const compsOf = subj => state.competencias.filter(c => c.subjectId === subj).sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true}));
const critsOf = compId => state.criterios.filter(c => c.compId === compId).sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true}));
const tasksOf = subj => state.tareas.filter(t => t.subjectId === subj && t.active !== false).sort((a,b)=>a.name.localeCompare(b.name,'es'));
function taskComps(t){ // competencias de una tarea: las marcadas + las de sus criterios
  const set = new Set(t.compIds || []);
  (t.critIds || []).forEach(id => { const cr = byId(state.criterios, id); if (cr) set.add(cr.compId); });
  return [...set];
}
function taskCodes(t){
  const cs = taskComps(t).map(id => byId(state.competencias,id)).filter(Boolean).sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true}));
  return cs.map(c => { const crs = (t.critIds||[]).map(id=>byId(state.criterios,id)).filter(cr=>cr && cr.compId===c.id).map(cr=>cr.code);
    return `<span class="cc" title="${esc(c.text)}">${esc(c.code)}${crs.length?' · '+crs.map(esc).join(', '):''}</span>`; }).join('');
}
const gradeFor = avg => { if (avg == null) return null; const c = state.prefs.cuts; let i = 0; while (i < c.length && avg >= c[i]) i++; return GRADES[i]; };
const lvlName = v => v == null ? 'No realizada' : LEVELS[v] || v;
// Evaluaciones de tarea: si hay varias del mismo alumno y tarea, vale la última
function latestTaskEvals(recs){
  const m = new Map();
  recs.forEach(r => { if (r.task) { const k = r.sid+'|'+r.task; const p = m.get(k); if (!p || r.ts >= p.ts) m.set(k, r); } });
  return [...m.values()];
}
const dedupeTasks = recs => recs.filter(r => !r.task).concat(latestTaskEvals(recs));
// Nivel medio por competencia y criterio (escala 1–4) a partir de las evaluaciones vigentes
function compLevels(recs){
  const comp = {}, crit = {};
  latestTaskEvals(recs).forEach(r => { if (r.val == null) return;
    (r.comp||[]).forEach(id => (comp[id] || (comp[id]=[])).push(r.val));
    (r.crit||[]).forEach(id => (crit[id] || (crit[id]=[])).push(r.val)); });
  const f = o => Object.fromEntries(Object.entries(o).map(([k,a]) => [k, {avg:mean(a), n:a.length}]));
  return {comp:f(comp), crit:f(crit)};
}

// ---------- Almacenamiento (IndexedDB) ----------
let db = null;
function openDB(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open('registraula', 1);
    rq.onupgradeneeded = () => {
      const d = rq.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', {keyPath:'id'});
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => res(out instanceof IDBRequest ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
// Marcas de cambio para sincronizar: cada elemento guarda _u (última modificación) y los borrados quedan en state.tomb
let snap = new Map();
const stripU = e => { const {_u, ...r} = e; return JSON.stringify(r); };
function buildSnap(){ snap = new Map(); COLLS.forEach(c => (state[c]||[]).forEach(e => snap.set(e.id, stripU(e)))); }
function stamp(){
  const now = Date.now(), seen = new Set();
  COLLS.forEach(c => (state[c]||[]).forEach(e => { seen.add(e.id); const j = stripU(e); if (snap.get(e.id) !== j) { e._u = now; snap.set(e.id, j); } }));
  for (const id of [...snap.keys()]) if (!seen.has(id)) { state.tomb[id] = now; snap.delete(id); }
}
const saveState = (noStamp) => { if (noStamp !== true) stamp(); return tx('kv','readwrite', s => s.put(state, 'state')).catch(err => alert('Error guardando: ' + err)); };
const putRecords = (recs, keepU) => { const now = Date.now(); if (!keepU) recs.forEach(r => r._u = now);
  return tx('records','readwrite', s => { recs.forEach(r => s.put(r)); }).catch(err => alert('Error guardando: ' + err)); };
const rawDel = ids => tx('records','readwrite', s => { ids.forEach(id => s.delete(id)); });
const delRecords = ids => { const now = Date.now(); ids.forEach(id => state.tomb[id] = now); saveState(); return rawDel(ids); };
async function loadAll(){
  db = await openDB();
  state = await tx('kv','readonly', s => s.get('state'));
  records = await tx('records','readonly', s => s.getAll()) || [];
  if (!state) state = defaultState();
  state = migrate(state); buildSnap(); await saveState(true);
  records.sort((a,b) => a.ts - b.ts);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}

// ---------- Contexto de sesión según el horario ----------
function currentContext(){
  const now = new Date(), d = now.getDay(), t = hm(now);
  const auto = state.schedule.find(s => s.day === d && s.start <= t && t < s.end);
  const key = (auto ? auto.id : 'none') + ymd(now);
  const valid = (gid, subj) => byId(state.groups, gid) && byId(state.subjects, subj);
  const today = ymd(now);
  // Sesión abierta desde "Plan" (puede ser de otro día): se mantiene hasta volver al horario
  if (ui.manual && ui.manual.pinned && valid(ui.manual.gid, ui.manual.subj))
    return {gid:ui.manual.gid, subj:ui.manual.subj, date:ui.manual.date, start:ui.manual.start, src:'plan', auto, key};
  if (ui.manual && ui.manual.key === key && valid(ui.manual.gid, ui.manual.subj))
    return {gid:ui.manual.gid, subj:ui.manual.subj, date:today, start:slotStart(today, ui.manual.gid, ui.manual.subj), src:'manual', auto, key};
  if (auto && valid(auto.groupId, auto.subjectId))
    return {gid:auto.groupId, subj:auto.subjectId, date:today, start:auto.start, src:'horario', auto, key};
  const gid = (ui.last && byId(state.groups, ui.last.gid)) ? ui.last.gid : (state.groups[0] || {}).id;
  const subj = (ui.last && byId(state.subjects, ui.last.subj)) ? ui.last.subj
             : ((state.subjects.find(s=>s.name==='Tutoría') || state.subjects[0] || {}).id);
  return {gid, subj, date:today, start:slotStart(today, gid, subj), src:'libre', auto:null, key};
}
// Primera sesión del horario de ese grupo y materia en esa fecha ('' si no hay)
function slotStart(date, gid, subj){
  const d = parseYmd(date).getDay();
  const s = state.schedule.filter(x => x.day === d && x.groupId === gid && x.subjectId === subj).sort((a,b)=>a.start.localeCompare(b.start));
  return s.length ? s[0].start : '';
}
// Plan de una sesión concreta
function planFor(date, gid, subj, start){
  return state.plan.find(p => p.date === date && p.gid === gid && p.subj === subj && p.start === (start||''))
      || (!start ? state.plan.find(p => p.date === date && p.gid === gid && p.subj === subj) : null);
}
function ensurePlan(date, gid, subj, start){
  let p = state.plan.find(p => p.date === date && p.gid === gid && p.subj === subj && p.start === (start||''));
  if (!p) { p = {id:uid(), date, gid, subj, start:start||'', taskIds:[]}; state.plan.push(p); }
  return p;
}
const planTasks = p => p ? p.taskIds.map(id => byId(state.tareas, id)).filter(Boolean) : [];
// Evaluaciones de una tarea en una sesión (fecha) para un grupo
const sessionEvals = (date, gid, taskId) => records.filter(r => r.task === taskId && r.gid === gid && r.date === date);
const studentsOf = gid => state.students.filter(s => s.groupId === gid && s.active !== false);
const indicatorsFor = subj => state.indicators.filter(i => i.active !== false && (i.subjectId === '*' || i.subjectId === subj));

  return extra + arr.map(x => `<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');
}
function viewAula(){

    <h2>Bienvenido a RegistrAula</h2>
    <p>Para empezar, crea tu grupo y añade el alumnado. Después, introduce el horario para que la aplicación sepa en qué sesión estás.</p>

    </div></div></div>`;
  const ctx = currentContext();
  ui.ctxKey = ctx.key;
  const subj = byId(state.subjects, ctx.subj) || {};

function ctxTs(ctx){
  if (ctx.date === ymd(new Date())) return Date.now();
  const [h,m] = (ctx.start || '12:00').split(':').map(Number);
  const d = parseYmd(ctx.date); d.setHours(h, m + 5, 0, 0); return d.getTime();
}
function evalTask(taskId, sids, v){
  const ctx = currentContext(), t = byId(state.tareas, taskId); if (!t || !sids.length) return;
  const val = v === 'NR' ? null : Number(v), note = ui.note.trim();
  const put = [], del = [];
  sids.forEach(sid => {
    const ex = sessionEvals(ctx.date, ctx.gid, taskId).find(r => r.sid === sid);
    if (ex && ex.val === val && sids.length === 1) { del.push(ex.id); return; }   // mismo nivel otra vez: se quita
    if (ex) { ex.val = val; ex.nr = val == null; if (note) ex.note = note; put.push(ex); return; }
    put.push({id:uid(), ts:ctxTs(ctx), date:ctx.date, sid, gid:ctx.gid, subj:ctx.subj, task:taskId, name:t.name,
      cat:'Evaluación', area:'A', v:0, mode:'score', val, min:1, max:4, nr: val == null,
      comp: taskComps(t), crit: (t.critIds||[]).slice(), note});
  });
  if (del.length) { records = records.filter(r => !del.includes(r.id)); delRecords(del); }
  const fresh = put.filter(r => !records.includes(r)); records.push(...fresh);
  if (put.length) putRecords(put);
  ui.lastBatch = fresh.map(r => r.id); ui.note = ''; ui.last = {gid:ctx.gid, subj:ctx.subj};
  const who = sids.length > 3 ? sids.length+' alumnos' : sids.map(id=>splitName((byId(state.students,id)||{}).name||'').first).join(', ');
  toast(del.length ? `Evaluación quitada · ${who}` : `${t.name}: ${lvlName(val)} → ${who}`, fresh.length ? [['Deshacer','undo']] : []);
  rerender();
  if (navigator.vibrate) navigator.vibrate(15);
}
function chipFor(r){
  if (r.task) return r.val == null ? `<span class="chip z">NR</span>` : `<span class="chip z" style="background:var(--l${r.val});color:var(--l${r.val}i)">${r.val}</span>`;
  if (r.mode === 'score') return `<span class="chip z">${fmtNum(r.val, Number.isInteger(r.val)?0:1)}/${r.max}</span>`;
  if (r.v > 0) return `<span class="chip p">+</span>`;
  if (r.v < 0) return `<span class="chip n">−</span>`;
  return `<span class="chip z">•</span>`;
}

function addRecords(ind, val, extra={}){
  const ctx = currentContext();
  const ts = ctxTs(ctx);
  const note = (extra.note != null ? extra.note : ui.note).trim();
  const recs = [...ui.sel].map(sid => ({
    id: uid(), ts, date: ctx.date, sid, gid: ctx.gid, subj: ctx.subj,
    ind: ind.id || null, name: ind.name, cat: ind.cat, area: AREA[ind.cat] || 'C',
    v: ind.mode === 'score' ? 0 : ind.v, mode: ind.mode,
    val: val, min: ind.min, max: ind.max, note
  }));
  if (!recs.length) return;
  records.push(...recs);
  putRecords(recs);
  ui.lastBatch = recs.map(r => r.id);
  ui.last = {gid: ctx.gid, subj: ctx.subj};
  const names = recs.map(r => splitName((byId(state.students,r.sid)||{}).name||'').first);
  toast(`${ind.name} → ${names.length>3 ? names.length+' alumnos' : names.join(', ')}`, [['Deshacer','undo'], ...(note?[]:[['+ Nota','noteLast']])]);
  if (state.prefs.deselect) ui.sel.clear();
  ui.note = ''; ui.pending = null;
  rerender();
  if (navigator.vibrate) navigator.vibrate(15);
}

function nextSession(date, gid, subj){
  const d = parseYmd(date);
  for (let i = 1; i <= 28; i++){
    const x = new Date(d); x.setDate(x.getDate()+i);
    const s = state.schedule.filter(s => s.day === x.getDay() && s.groupId === gid && s.subjectId === subj).sort((a,b)=>a.start.localeCompare(b.start))[0];
    if (s) return {date: ymd(x), start: s.start};
  }
  return null;
}

function periodRange(p){
  const now = new Date(); let from, to = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  if (p === 'semana') from = monday(now);
  else if (p === '4sem') { from = monday(now); from.setDate(from.getDate()-21); }
  else if (p === 'trim') {
    const m = now.getMonth(), y = now.getFullYear();
    from = m >= 8 ? new Date(y,8,1) : m <= 2 ? new Date(y,0,1) : new Date(y,3,1);
  }
  else if (p === 'curso') { const y = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear()-1; from = new Date(y,8,1); }
  else if (p === 'custom') {
    from = ui.rep.from ? parseYmd(ui.rep.from) : monday(now);
    to = ui.rep.to ? parseYmd(ui.rep.to) : new Date(now); to.setDate(to.getDate()+1);
  }
  else { from = records.length ? new Date(records[0].ts) : monday(now); from = new Date(from.getFullYear(), from.getMonth(), from.getDate()); }
  return {from, to};
}
function weeksBetween(from, to){
  const out = []; let d = monday(from);
  while (d < to && out.length < 60) { out.push(new Date(d)); d = new Date(d); d.setDate(d.getDate()+7); }
  return out;
}

  const stuOpts = state.students.filter(s => s.groupId === f.gid);
  let h = `<div class="wrap"><div class="filters noprint">
    <label class="f">Grupo<select data-c="repG">${selectOptions(state.groups, f.gid)}</select></label>
    <label class="f">Alumno<select data-c="repS">${selectOptions(stuOpts, f.sid, '<option value="">Toda la clase</option>')}</select></label>
    <label class="f">Materia<select data-c="repM">${selectOptions(state.subjects, f.subj, '<option value="">Todas</option>')}</select></label>
    <label class="f">Periodo<select data-c="repP">${pers.map(([k,l])=>`<option value="${k}" ${f.period===k?'selected':''}>${l}</option>`).join('')}</select></label>
    ${f.period==='custom'?`<label class="f">Desde<input type="date" data-c="repFrom" value="${f.from||ymd(from)}"></label>
      <label class="f">Hasta<input type="date" data-c="repTo" value="${f.to||ymd(new Date(+to-864e5))}"></label>`:''}
    <button class="btn" data-a="print">Imprimir / PDF</button>
  </div>`;
  const subjName = f.subj ? (byId(state.subjects,f.subj)||{}).name : 'Todas las materias';
  const range = `${from.toLocaleDateString('es-ES')} – ${new Date(+to-864e5).toLocaleDateString('es-ES')}`;
  if (f.sid && byId(state.students, f.sid)) h += studentReport(byId(state.students, f.sid), recs.filter(r=>r.sid===f.sid), from, to, grp, subjName, range);
  else h += classReport(grp, recs, from, to, subjName, range);
  return h + `</div>`;
}

function stats(recs){
  const pos = recs.filter(r => r.mode!=='score' && r.v>0).length;
  const neg = recs.filter(r => r.mode!=='score' && r.v<0).length;
  const scA = dedupeTasks(recs).filter(r => r.area==='A').map(norm).filter(x=>x!=null);
  const scC = recs.filter(r => r.area==='C').map(norm).filter(x=>x!=null);
  return {n:recs.length, pos, neg, pct: (pos+neg) ? pos/(pos+neg)*100 : null, avgA: mean(scA), nA: scA.length, avgC: mean(scC)};
}
function kpi(l, v, s=''){ return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`; }

function classReport(grp, recs, from, to, subjName, range){
  const studs = studentsOf(grp.id);
  const st = stats(recs);
  const per = studs.map(s => { const rs = recs.filter(r=>r.sid===s.id); return {s, ...stats(rs), last: rs.length ? rs[rs.length-1].ts : null}; });
  const counts = per.map(p=>p.n).sort((a,b)=>a-b);
  const median = counts.length ? counts[Math.floor(counts.length/2)] : 0;
  const few = per.filter(p => p.n <= Math.max(0, Math.floor(median*0.35)));
  let h = `<div class="print-only"><h2>Informe de grupo · ${esc(grp.name)}</h2></div>
    <h2 class="noprint">${esc(grp.name)} <span class="muted small">· ${esc(subjName)} · ${range}</span></h2>
    <p class="print-only muted">${esc(subjName)} · ${range}</p>`;
  if (!recs.length) return h + `<div class="card empty">No hay registros en este periodo.</div>`;
  h += `<div class="kpis">
    ${kpi('Registros', st.n, `${per.filter(p=>p.n).length} de ${studs.length} alumnos con registros`)}
    ${kpi('Positivos', st.pos, st.pct!=null?`${fmtNum(st.pct,0)} % de las conductas anotadas`:'')}
    ${kpi('Negativos', st.neg, '')}
    ${kpi('Media académica', st.avgA!=null?fmtNum(st.avgA):'–', st.nA?`sobre 10 · ${st.nA} puntuaciones`:'sin puntuaciones')}
  </div>`;
  if (few.length && studs.length > 3) h += `<div class="banner">👁 <span><b>Atención equitativa:</b> tienes muy pocos registros de ${few.map(p=>esc(splitName(p.s.name).first)).join(', ')}.
    Conviene observarlos también: el alumnado "invisible" suele quedarse sin evaluar.</span></div>`;
  const weeks = weeksBetween(from, to);
  h += `<div class="charts"><div class="card chart"><h4>Balance de conducta por semana</h4><div class="sub">Anotaciones positivas (arriba) y negativas (abajo) de todo el grupo</div>
    ${divergingWeeks(weeks, recs)}</div>
    <div class="card chart"><h4>Qué se anota más</h4><div class="sub">Indicadores más frecuentes del grupo</div>${topIndicators(recs, 8)}</div></div>`;
  const maxPN = Math.max(1, ...per.map(p=>Math.max(p.pos,p.neg)));
  h += `<div class="card"><h4 style="margin:0 0 8px">Alumnado <span class="muted small noprint">· toca un nombre para ver su informe</span></h4><div style="overflow:auto"><table class="tbl">
    <thead><tr><th>Alumno</th><th class="num">Registros</th><th class="num">+</th><th class="num">−</th><th>Balance</th><th class="num">Media acad.</th><th>Último registro</th></tr></thead><tbody>` +
    per.sort((a,b)=>a.s.name.localeCompare(b.s.name,'es')).map(p => `<tr class="click" data-a="repStu" data-id="${p.s.id}">
      <td><b>${esc(p.s.name)}</b></td><td class="num">${p.n}</td><td class="num">${p.pos}</td><td class="num">${p.neg}</td>
      <td>${miniBalance(p.pos, p.neg, maxPN)}</td><td class="num">${p.avgA!=null?fmtNum(p.avgA):'–'}</td>
      <td class="muted small">${p.last?fmtDate(p.last):'—'}</td></tr>`).join('') + `</tbody></table></div></div>`;
  h += compMatrix(studs, recs, f_subj());
  h += evoSection(recs.filter(r => r.task), 'class');
  return h;
}

  const st = stats(recs);

    ${kpi('Negativos', st.neg)}

  h += `<div class="card" style="margin-bottom:14px"><h4 style="margin:0 0 6px">Resumen automático</h4><ul class="summary" style="margin:0;padding-left:20px">${summaryText(s, recs, from, to)}</ul></div>`;

  h += `<div class="charts">

    <div class="card chart"><h4>Evolución académica</h4><div class="sub">Media semanal de las puntuaciones académicas, sobre 10</div>${lineWeeks(weeks, recs.filter(r=>r.area==='A'))}</div>
    <div class="card chart"><h4>Media académica por materia</h4><div class="sub">Sobre 10 · entre paréntesis, número de puntuaciones</div>${subjectBars(recs)}</div>
    <div class="card chart"><h4>Indicadores más frecuentes</h4><div class="sub">Número de veces anotado</div>${topIndicators(recs, 8)}</div>
    <div class="card chart"><h4>¿Cuándo aparecen las conductas negativas?</h4><div class="sub">Por día y hora. Ayuda a detectar antecedentes (momento, materia, cansancio)</div>${heatNeg(recs)}</div>
    <div class="card chart"><h4>Por tipo de actividad</h4><div class="sub">Positivas y negativas por categoría</div>${catBars(recs)}</div>
  </div>`;
  h += compSection(recs, f_subj());
  h += evoSection(recs.filter(r => r.task), 'student');
  const withNotes = recs.filter(r => r.note).slice().reverse();
  h += `<div class="card notes"><h4 style="margin:0 0 6px">Observaciones escritas (${withNotes.length})</h4>` +

      ${chipFor(r)} <b>${esc(r.name)}</b> — ${esc(r.note)}</div>`).join('') : `<p class="muted">No hay observaciones con texto en el periodo.</p>`) + `</div>`;

const f_subj = () => ui.rep.subj || '';
const lvCell = avg => { if (avg == null) return `<td class="lvc muted">–</td>`; const k = Math.min(4, Math.max(1, Math.round(avg)));
  return `<td class="lvc" style="background:var(--l${k});color:var(--l${k}i)" data-tip="${fmtNum(avg,2)} · ${LEVELS[k]}">${fmtNum(avg)}</td>`; };
function levelBar(avg){
  if (avg == null) return '<span class="muted">–</span>';
  const k = Math.min(4, Math.max(1, Math.round(avg))), w = 140;
  return `<svg viewBox="0 0 ${w} 14" width="${w}" height="14" style="vertical-align:middle"><rect x="0" y="3" width="${w}" height="8" rx="4" fill="var(--surface2)"/>
    <rect x="0" y="3" width="${Math.max(8, avg/4*w)}" height="8" rx="4" fill="var(--l${k === 1 ? 2 : k})"/></svg>`;
}
function areaAvg(levels, subj){
  const vals = compsOf(subj).map(c => levels.comp[c.id]).filter(Boolean).map(x => x.avg);
  return mean(vals);
}
// Informe individual: nivel por competencia y criterio
function compSection(recs, subj){
  const tr = recs.filter(r => r.task);
  if (!tr.length) return '';
  const subjIds = subj ? [subj] : [...new Set(tr.map(r => r.subj))];
  let h = '';
  subjIds.forEach(sid => {
    const rs = tr.filter(r => r.subj === sid); if (!rs.length) return;
    const m = byId(state.subjects, sid) || {name:'?'}, L = compLevels(rs), comps = compsOf(sid);
    const av = areaAvg(L, sid), g = gradeFor(av);
    h += `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between">
        <h4 style="margin:0">Competencias específicas · ${esc(m.name)}</h4>
        <span>Media del área: <b>${av!=null?fmtNum(av,2):'–'}</b> ${g?`· sugerida <span class="grade" title="${GRADE_L[g]}">${g}</span>`:''}</span></div>
      <p class="muted small" style="margin:4px 0 8px">Nivel medio de 1 a 4 con la última evaluación de cada tarea. La calificación es orientativa.</p>
      <div style="overflow:auto"><table class="tbl"><thead><tr><th>Competencia / criterio</th><th>Nivel</th><th class="num">Media</th><th class="num">Evid.</th></tr></thead><tbody>` +
      comps.map(c => { const x = L.comp[c.id];
        return `<tr><td><b>${esc(c.code)}</b> <span class="small">${esc(c.text.length>110?c.text.slice(0,108)+'…':c.text)}</span></td><td>${levelBar(x&&x.avg)}</td>
          <td class="num"><b>${x?fmtNum(x.avg):'–'}</b></td><td class="num muted">${x?x.n:0}</td></tr>` +
          critsOf(c.id).filter(k => L.crit[k.id]).map(k => { const y = L.crit[k.id];
            return `<tr><td style="padding-left:24px" class="small"><span class="cc">${esc(k.code)}</span> ${esc(k.text.length>100?k.text.slice(0,98)+'…':k.text)}</td><td>${levelBar(y.avg)}</td>
              <td class="num">${fmtNum(y.avg)}</td><td class="num muted">${y.n}</td></tr>`; }).join(''); }).join('') + `</tbody></table></div>`;
    const last = latestTaskEvals(rs).sort((a,b)=>b.ts-a.ts);
    h += `<details style="margin-top:8px"><summary class="small ink2" style="cursor:pointer">Tareas evaluadas (${last.length})</summary><div class="list">` +
      last.map(r => `<div class="it small">${chipFor(r)}<span style="flex:1"><b>${esc(r.name)}</b> · ${lvlName(r.val)}${r.note?` <span class="muted">— ${esc(r.note)}</span>`:''}</span><span class="muted">${fmtDate(r.ts)}</span></div>`).join('') +
      `</div></details></div>`;
  });
  return h;
}
// Informe de grupo: matriz alumnado × competencias
function compMatrix(studs, recs, subj){
  const tr = recs.filter(r => r.task);
  if (!tr.length) return '';
  if (!subj) return `<div class="card" style="margin-top:14px"><p class="muted" style="margin:0">Elige una materia en el filtro para ver la matriz de competencias específicas del grupo.</p></div>`;
  const comps = compsOf(subj); if (!comps.length) return '';
  let h = `<div class="card" style="margin-top:14px"><h4 style="margin:0 0 2px">Competencias específicas del grupo</h4>
    <p class="muted small" style="margin:0 0 8px">Nivel medio de 1 a 4 · la calificación es orientativa</p><div style="overflow:auto"><table class="tbl matrix"><thead><tr><th>Alumno</th>` +
    comps.map(c => `<th title="${esc(c.text)}" style="text-align:center">${esc(c.code)}</th>`).join('') + `<th class="num">Área</th><th>Sugerida</th></tr></thead><tbody>`;
  const colVals = comps.map(() => []);
  studs.slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).forEach(s => {
    const L = compLevels(tr.filter(r => r.sid === s.id)), av = areaAvg(L, subj), g = gradeFor(av);
    h += `<tr class="click" data-a="repStu" data-id="${s.id}"><td><b>${esc(s.name)}</b></td>` +
      comps.map((c,i) => { const x = L.comp[c.id]; if (x) colVals[i].push(x.avg); return lvCell(x && x.avg); }).join('') +
      `<td class="num"><b>${av!=null?fmtNum(av,2):'–'}</b></td><td>${g?`<span class="grade" title="${GRADE_L[g]}">${g}</span>`:''}</td></tr>`;
  });
  h += `<tr><td class="muted">Media del grupo</td>` + colVals.map(v => lvCell(mean(v))).join('') + `<td></td><td></td></tr></tbody></table></div>
    <div class="legend">${[1,2,3,4].map(k=>`<span><i style="background:var(--l${k})"></i>${k} ${LEVELS[k]}</span>`).join('')}</div></div>`;
  return h;
}

// Evolución de una tarea o de un criterio a lo largo de las sesiones
function evoSection(tr, mode){
  if (!tr.length) return '';
  const tasks = new Map(), crits = new Map();
  tr.forEach(r => { tasks.set(r.task, (tasks.get(r.task)||0) + 1); (r.crit||[]).forEach(id => crits.set(id, (crits.get(id)||0) + 1)); });
  const opts = [...[...tasks.entries()].map(([id,n]) => ({k:'t:'+id, lbl:(byId(state.tareas,id)||{name:(tr.find(r=>r.task===id)||{}).name||'?'}).name, n, g:'Tareas'})),
                ...[...crits.entries()].map(([id,n]) => { const k = byId(state.criterios,id); return k ? {k:'k:'+id, lbl:`${k.code} ${k.text}`, n, g:'Criterios de evaluación'} : null; }).filter(Boolean)];
  if (!opts.length) return '';
  if (!opts.some(o => o.k === ui.rep.evo)) ui.rep.evo = opts.sort((a,b)=>b.n-a.n)[0].k;
  const [kind, id] = ui.rep.evo.split(':');
  const rs = tr.filter(r => kind === 't' ? r.task === id : (r.crit||[]).includes(id));
  const byDate = {};
  rs.forEach(r => { const d = recDate(r); (byDate[d] || (byDate[d] = [])).push(r); });
  const pts = Object.keys(byDate).sort().map(d => { const a = byDate[d], vals = a.filter(r=>r.val!=null).map(r=>r.val);
    return {d, v: mean(vals), n: vals.length, nr: a.length - vals.length}; });
  const grp = g => opts.filter(o=>o.g===g).map(o => `<option value="${o.k}" ${o.k===ui.rep.evo?'selected':''}>${esc(o.lbl.length>70?o.lbl.slice(0,68)+'…':o.lbl)} (${o.n})</option>`).join('');
  const withV = pts.filter(p => p.v != null);
  let trend = '';
  if (withV.length >= 2){ const a = withV[0].v, b = withV[withV.length-1].v, d = b - a;
    trend = Math.abs(d) < 0.25 ? `Estable (${fmtNum(a)} → ${fmtNum(b)}).` : d > 0 ? `<b>Mejora</b>: de ${fmtNum(a)} a ${fmtNum(b)}.` : `<b>Baja</b>: de ${fmtNum(a)} a ${fmtNum(b)}.`; }
  return `<div class="card chart" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><h4>Evolución ${mode==='class'?'del grupo ':''}por tarea o criterio</h4>
      <div class="sub">${mode==='class'?'Nivel medio del grupo en cada sesión':'Nivel en cada sesión en que se evaluó'} (1 No conseguido · 4 Destacado)${trend?' · '+trend:''}</div></div>
      <select data-c="evoSel" class="noprint" style="max-width:420px"><optgroup label="Tareas">${grp('Tareas')}</optgroup><optgroup label="Criterios de evaluación">${grp('Criterios de evaluación')}</optgroup></select></div>
    ${levelLine(pts, mode)}</div>`;
}
function levelLine(pts, mode){
  const W = 620, H = 210, L = 30, R = 16, T = 14, B = 30, iw = W-L-R, ih = H-T-B;
  const X = i => pts.length === 1 ? L + iw/2 : L + i * iw/(pts.length-1), Y = v => T + ih - (v-1)/3*ih;
  const every = Math.ceil(pts.length/10);
  let g = '';
  [1,2,3,4].forEach(v => g += `<line class="axis" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);
  let path = '', on = false;
  pts.forEach((p,i) => { if (p.v == null) { on = false; return; } path += `${on?'L':'M'}${X(i)},${Y(p.v)} `; on = true; });
  g += `<path d="${path}" fill="none" stroke="var(--pos)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i) => { const dd = parseYmd(p.d), lbl = `${dd.getDate()}/${dd.getMonth()+1}`;
    const tip = `${DAYS_L[dd.getDay()]} ${lbl}: ${p.v!=null?fmtNum(p.v,mode==='class'?1:0)+(mode==='class'?` (media de ${p.n})`:' · '+LEVELS[Math.round(p.v)]):'sin nivel'}${p.nr?` · ${p.nr} no realizada${p.nr>1?'s':''}`:''}`;
    if (p.v != null) g += `<circle cx="${X(i)}" cy="${Y(p.v)}" r="5" fill="var(--pos)" stroke="var(--surface)" stroke-width="2"/>`;
    else g += `<text x="${X(i)}" y="${Y(1)+4}" text-anchor="middle" style="fill:var(--muted);font-weight:700">NR</text>`;
    g += `<circle cx="${X(i)}" cy="${p.v!=null?Y(p.v):Y(1)}" r="16" fill="transparent" data-tip="${esc(tip)}"/>`;
    if (i % every === 0) g += `<text x="${X(i)}" y="${H-10}" text-anchor="middle">${lbl}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">${g}</svg>`;
}

function summaryText(s, recs, from, to){
  const st = stats(recs), items = [];
  const first = splitName(s.name).first;
  if (st.pos + st.neg) items.push(`${st.pos} anotaci${st.pos===1?'ón positiva':'ones positivas'} y ${st.neg} negativa${st.neg===1?'':'s'} (${fmtNum(st.pct,0)} % positivas).`);
  const negs = recs.filter(r => r.mode!=='score' && r.v<0);
  if (negs.length){
    const byInd = countBy(negs, r=>r.name); const top = Object.entries(byInd).sort((a,b)=>b[1]-a[1])[0];
    items.push(`Conducta negativa más frecuente: <b>${esc(top[0])}</b> (${top[1]} ${top[1]===1?'vez':'veces'}).`);
    const bySlot = countBy(negs, r=>{ const d=new Date(r.ts); return `${DAYS_L[d.getDay()]} de ${d.getHours()}:00 a ${d.getHours()+1}:00`; });
    const ts = Object.entries(bySlot).sort((a,b)=>b[1]-a[1])[0];
    if (ts[1] >= 2) items.push(`Se concentra sobre todo los <b>${ts[0]}</b> (${ts[1]} registros).`);
    const bySubj = countBy(negs, r=>(byId(state.subjects,r.subj)||{}).name||'?'); const tsub = Object.entries(bySubj).sort((a,b)=>b[1]-a[1])[0];
    if (Object.keys(bySubj).length > 1 && tsub[1] >= 2) items.push(`Materia con más incidencias: <b>${esc(tsub[0])}</b> (${tsub[1]}).`);
  }
  const poss = recs.filter(r => r.mode!=='score' && r.v>0);
  if (poss.length){ const top = Object.entries(countBy(poss, r=>r.name)).sort((a,b)=>b[1]-a[1])[0];
    items.push(`Fortaleza más anotada: <b>${esc(top[0])}</b> (${top[1]}).`); }
  // Tendencia: primera mitad vs segunda mitad del periodo
  const mid = (+from + +to)/2;
  const a = stats(recs.filter(r=>r.ts<mid)), b = stats(recs.filter(r=>r.ts>=mid));
  if (a.pos+a.neg >= 3 && b.pos+b.neg >= 3){
    const d = b.pct - a.pct;
    items.push(Math.abs(d) < 10 ? `La conducta se mantiene estable a lo largo del periodo (${fmtNum(a.pct,0)} % → ${fmtNum(b.pct,0)} % positivas).`
      : d > 0 ? `La conducta <b>mejora</b>: pasa del ${fmtNum(a.pct,0)} % al ${fmtNum(b.pct,0)} % de anotaciones positivas.`
              : `La conducta <b>empeora</b>: pasa del ${fmtNum(a.pct,0)} % al ${fmtNum(b.pct,0)} % de anotaciones positivas.`);
  }
  if (st.avgA != null){
    let t = `Media académica de ${fmtNum(st.avgA)} sobre 10 (${st.nA} puntuaciones)`;
    if (a.avgA != null && b.avgA != null && a.nA >= 2 && b.nA >= 2){
      const d = b.avgA - a.avgA;
      t += Math.abs(d) < 0.5 ? ', estable.' : d > 0 ? `, con tendencia al alza (${fmtNum(a.avgA)} → ${fmtNum(b.avgA)}).` : `, con tendencia a la baja (${fmtNum(a.avgA)} → ${fmtNum(b.avgA)}).`;
    } else t += '.';

function divergingWeeks(weeks, recs){

const COND_CATS = ['Conducta','Relación social','Hábitos y autonomía','Tarea','Participación'];

function acadLevel(rs, subj){
  const tr = rs.filter(r => r.task && r.subj === subj);
  if (tr.length && compsOf(subj).length){ const a = areaAvg(compLevels(tr), subj); if (a != null) return a; }
  const vals = latestTaskEvals(tr).filter(r => r.val != null).map(r => r.val);
  if (vals.length) return mean(vals);
  const sc = rs.filter(r => !r.task && r.mode === 'score' && r.area === 'A' && r.subj === subj).map(toLvl).filter(x => x != null);
  return mean(sc);
}
function panelData(){

  let recs = records.filter(r => r.gid === P.gid && r.ts >= +from && r.ts < +to);
  if (P.subj) recs = recs.filter(r => r.subj === P.subj);
  const subjIds = P.subj ? [P.subj] : state.subjects.map(s => s.id).filter(id => recs.some(r => r.subj === id && isVal(r)));
  const mid = (+from + +to) / 2;
  const per = studs.map(s => {
    const rs = recs.filter(r => r.sid === s.id);
    const lv = {}; subjIds.forEach(id => lv[id] = acadLevel(rs, id));
    const glob = mean(Object.values(lv).filter(v => v != null));
    const L = compLevels(rs.filter(r => r.task));
    const cond = {}; COND_CATS.forEach(c => { const x = rs.filter(r => isAnot(r) && r.cat === c); cond[c] = {p:x.filter(r=>r.v>0).length, n:x.filter(r=>r.v<0).length}; });

    return {s, rs, lv, glob, comp:L.comp, crit:L.crit, cond, pos, neg,

      `<td class="num ${D.medVal>=4 && p.nVal<D.medVal*0.5?'warnnum':''}">${p.nVal}</td><td class="num ${D.medAnot>=4 && p.nAnot<D.medAnot*0.5?'warnnum':''}">${p.nAnot}</td></tr>`).join('') +
    `<tr><td class="muted">Media de la clase</td>${cols.map(c => c.k==='s' ? dCell(D.classLv[c.id]) : dCell(mean(D.per.map(p=>p.comp[c.id]&&p.comp[c.id].avg).filter(v=>v!=null)))).join('')}${dCell(D.classGlob)}

    ${dLegend()}</div>`;
  return h;
}
const dLegend = () => `<div class="legend"><span><i class="d1"></i>&lt; 1,75</span><span><i class="d2"></i>1,75–2,25</span><span><i class="d3"></i>2,25–2,75</span><span><i class="d4"></i>2,75–3,25</span><span><i class="d5"></i>≥ 3,25</span><span><i style="background:rgba(227,73,72,.6)"></i>anotaciones negativas</span></div>`;

// ---------- Ficha de alumno ----------
function panelAlumno(D){
  const P = ui.pan;
  if (!P.sid || !D.per.some(p => p.s.id === P.sid)) P.sid = D.per[0] && D.per[0].s.id;
  const p = D.per.find(x => x.s.id === P.sid); if (!p) return '';
  const avg = f => mean(D.per.map(f).filter(v => v != null));
  let h = `<div class="row noprint" style="margin-bottom:10px"><label class="f">Alumno<select data-c="panS">${D.per.map(x => `<option value="${x.s.id}" ${x.s.id===P.sid?'selected':''}>${esc(x.s.name)}</option>`).join('')}</select></label>
    <button class="btn sm" data-a="panOpenRep" style="align-self:flex-end">Informe completo ›</button></div>
    <h2 class="print-only">${esc(p.s.name)}</h2>`;
  const pct = (p.pos+p.neg) ? p.pos/(p.pos+p.neg)*100 : null, cpct = avg(x => (x.pos+x.neg) ? x.pos/(x.pos+x.neg)*100 : null);
  h += `<div class="kpis">
    ${kpi('Nivel global', p.glob!=null?fmtNum(p.glob,2):'–', `media de la clase ${D.classGlob!=null?fmtNum(D.classGlob,2):'–'}${p.glob!=null?' · sugerida '+gradeFor(p.glob):''}`)}
    ${kpi('Conductas positivas', pct!=null?fmtNum(pct,0)+' %':'–', `clase ${cpct!=null?fmtNum(cpct,0)+' %':'–'} · +${p.pos} / −${p.neg}`)}
    ${kpi('Valoraciones', p.nVal, `mediana de la clase ${D.medVal}`)}
    ${kpi('Anotaciones', p.nAnot, `mediana de la clase ${D.medAnot}${p.nr?` · ${p.nr} no realizadas`:''}`)}
  </div>`;
  // Comparativa con la media
  const rows = [];
  D.subjIds.forEach(id => rows.push({g:'Materias', lbl:sName(id), v:p.lv[id], c:D.classLv[id], lvl:true}));
  if (P.subj) {
    compsOf(P.subj).forEach(c => rows.push({g:'Competencias', lbl:`${esc(c.code)} <span class="muted small">${esc(c.text.slice(0,60))}${c.text.length>60?'…':''}</span>`, v:p.comp[c.id]&&p.comp[c.id].avg, c:avg(x=>x.comp[c.id]&&x.comp[c.id].avg), lvl:true}));
    compsOf(P.subj).forEach(c => critsOf(c.id).forEach(k => { if (p.crit[k.id]) rows.push({g:'Criterios', lbl:`${esc(k.code)} <span class="muted small">${esc(k.text.slice(0,60))}${k.text.length>60?'…':''}</span>`, v:p.crit[k.id].avg, c:avg(x=>x.crit[k.id]&&x.crit[k.id].avg), lvl:true}); }));
  }
  COND_CATS.forEach(c => rows.push({g:'Anotaciones negativas (menos es mejor)', lbl:esc(c), v:p.cond[c].n, c:avg(x=>x.cond[c].n), lvl:false}));
  let lastG = '';
  h += `<div class="card" style="margin-bottom:14px"><h4 style="margin:0 0 6px">Comparado con la media de la clase</h4><div style="overflow:auto"><table class="tbl"><thead><tr><th></th><th class="num">Alumno</th><th class="num">Clase</th><th>Diferencia</th></tr></thead><tbody>` +
    rows.map(r => { let x = '';
      if (r.g !== lastG) { x += `<tr><td colspan="4" class="catlbl" style="padding-top:12px">${r.g}</td></tr>`; lastG = r.g; }
      const d = (r.v != null && r.c != null) ? r.v - r.c : null;
      const good = d == null ? null : (r.lvl ? d >= 0 : d <= 0);
      const scale = r.lvl ? 1.5 : Math.max(2, ...D.per.map(q => Math.max(...COND_CATS.map(c=>q.cond[c].n))));
      return x + `<tr><td>${r.lbl}</td>${r.lvl ? dCell(r.v) : `<td class="num">${r.v}</td>`}<td class="num muted">${r.c!=null?fmtNum(r.c):'–'}</td><td>${diffBar(d, scale, good)}</td></tr>`; }).join('') + `</tbody></table></div></div>`;
  // Evolución
  h += evoPanel(D, p);
  return h;
}
function diffBar(d, scale, good){
  if (d == null) return '<span class="muted">–</span>';
  const W = 160, mid = 80, w = Math.min(mid-2, Math.abs(d)/scale*(mid-2));
  const x = d >= 0 ? mid : mid - w;
  return `<svg viewBox="0 0 ${W} 14" width="${W}" height="14" style="vertical-align:middle"><rect x="${x}" y="2" width="${Math.max(1,w)}" height="10" rx="2" fill="${good?'var(--pos)':'var(--neg)'}"/>
    <line x1="${mid}" x2="${mid}" y1="0" y2="14" stroke="var(--muted)"/></svg> <span class="small">${d>0?'+':''}${fmtNum(d)}</span>`;
}
// Evolución del alumno frente a la clase, totalizando por lo que elijas
function evoPanel(D, p){
  const P = ui.pan, opts = [['glob','Nivel académico global']];
  D.subjIds.forEach(id => opts.push(['s:'+id, 'Materia · ' + (byId(state.subjects,id)||{}).name]));
  const subjs = P.subj ? [P.subj] : D.subjIds;
  subjs.forEach(sid => compsOf(sid).forEach(c => { if (p.rs.some(r => (r.comp||[]).includes(c.id))) opts.push(['c:'+c.id, `Competencia · ${(byId(state.subjects,sid)||{}).name} ${c.code}`]); }));
  subjs.forEach(sid => compsOf(sid).forEach(c => critsOf(c.id).forEach(k => { if (p.rs.some(r => (r.crit||[]).includes(k.id))) opts.push(['k:'+k.id, `Criterio · ${k.code} ${k.text.slice(0,50)}`]); })));
  opts.push(['b:*','Conducta · todas las anotaciones']); COND_CATS.forEach(c => opts.push(['b:'+c, 'Conducta · ' + c]));
  if (!opts.some(o => o[0] === P.evo)) P.evo = 'glob';
  const [kind, id] = P.evo.includes(':') ? P.evo.split(/:(.*)/s) : [P.evo, ''];
  const weeks = weeksBetween(D.from, D.to);
  let body;
  if (kind === 'b'){
    const f = r => isAnot(r) && (id === '*' || r.cat === id);
    body = divergingWeeks(weeks, p.rs.filter(f));
  } else {
    const f = kind === 'glob' ? isVal : kind === 's' ? (r => isVal(r) && r.subj === id) : kind === 'c' ? (r => r.task && (r.comp||[]).includes(id)) : (r => r.task && (r.crit||[]).includes(id));
    const wk = rs => weeks.map(w => { const e = +w + 7*864e5; const v = rs.filter(r => r.ts >= +w && r.ts < e && f(r)).map(r => r.task ? r.val : toLvl(r)).filter(v => v != null); return v.length ? mean(v) : null; });
    body = twoLines(weeks, wk(p.rs), wk(D.recs));
  }
  return `<div class="card chart"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h4>Evolución</h4>
      <div class="sub">${kind==='b'?'Anotaciones positivas (arriba) y negativas (abajo) por semana':'Nivel medio semanal (1–4): alumno frente a la media de la clase'}</div></div>
      <select data-c="panEvo" class="noprint" style="max-width:420px">${opts.map(([k,l]) => `<option value="${k}" ${k===P.evo?'selected':''}>${esc(l)}</option>`).join('')}</select></div>${body}</div>`;
}
function twoLines(weeks, a, b){
  if (!a.some(v => v != null)) return `<p class="muted">Sin valoraciones de este alumno para lo elegido en el periodo.</p>`;
  const W = 620, H = 220, L = 30, R = 16, T = 14, B = 30, iw = W-L-R, ih = H-T-B, n = weeks.length;
  const X = i => n === 1 ? L + iw/2 : L + i*iw/(n-1), Y = v => T + ih - (v-1)/3*ih;
  const every = Math.ceil(n/10);
  let g = '';
  [1,2,3,4].forEach(v => g += `<line class="axis" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);
  const path = arr => { let d = '', on = false; arr.forEach((v,i) => { if (v == null) { on = false; return; } d += `${on?'L':'M'}${X(i)},${Y(v)} `; on = true; }); return d; };
  g += `<path d="${path(b)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  g += `<path d="${path(a)}" fill="none" stroke="var(--pos)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  weeks.forEach((w,i) => { const lbl = `${w.getDate()}/${w.getMonth()+1}`;
    if (a[i] != null) g += `<circle cx="${X(i)}" cy="${Y(a[i])}" r="4.5" fill="var(--pos)" stroke="var(--surface)" stroke-width="2"/>`;
    g += `<rect x="${X(i)-12}" y="${T}" width="24" height="${ih}" fill="transparent" data-tip="Semana del ${lbl}: alumno ${a[i]!=null?fmtNum(a[i]):'–'} · clase ${b[i]!=null?fmtNum(b[i]):'–'}"/>`;
    if (i % every === 0) g += `<text x="${X(i)}" y="${H-10}" text-anchor="middle">${lbl}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend"><span><i style="background:var(--pos)"></i>Alumno</span><span><i style="background:var(--muted)"></i>Media de la clase (discontinua)</span></div>`;
}

function panelComparar(D){

  const sel = P.cmp.map(id => D.per.find(p => p.s.id === id));
  if (sel.length < 2) return h + `<div class="card empty">Selecciona al menos dos alumnos para compararlos.</div>`;
  const avg = f => mean(D.per.map(f).filter(v => v != null));
  const rows = [['Nivel global', p => p.glob, D.classGlob, 'lvl']];

  if (P.subj) compsOf(P.subj).forEach(c => rows.push([esc(c.code), p => p.comp[c.id] && p.comp[c.id].avg, avg(x => x.comp[c.id] && x.comp[c.id].avg), 'lvl']));
  rows.push(['% conductas positivas', p => (p.pos+p.neg) ? p.pos/(p.pos+p.neg)*100 : null, avg(x => (x.pos+x.neg) ? x.pos/(x.pos+x.neg)*100 : null), 'pct']);
  COND_CATS.forEach(c => rows.push(['− ' + esc(c), p => p.cond[c].n, avg(x => x.cond[c].n), 'neg']));
  rows.push(['Valoraciones', p => p.nVal, D.medVal, 'n'], ['Anotaciones', p => p.nAnot, D.medAnot, 'n'], ['Tareas no realizadas', p => p.nr, avg(x => x.nr), 'neg']);
  h += `<div class="card"><div style="overflow:auto"><table class="tbl hmap"><thead><tr><th></th>${sel.map(p => `<th style="text-align:center">${fname(p)}</th>`).join('')}<th style="text-align:center">Clase</th></tr></thead><tbody>` +
    rows.map(([lbl, f, cl, t]) => `<tr><td>${lbl}</td>` + sel.map(p => { const v = f(p);
      if (t === 'lvl') return dCell(v);
      if (t === 'pct') return `<td class="hm">${v!=null?fmtNum(v,0)+' %':'–'}</td>`;
      if (t === 'neg') return `<td class="hm" style="${v&&cl!=null&&v>cl*1.5?'color:var(--neg);font-weight:800':''}">${v ?? '–'}</td>`;
      return `<td class="hm">${v}</td>`; }).join('') +
      `<td class="hm muted">${cl==null?'–':t==='pct'?fmtNum(cl,0)+' %':t==='n'?cl:fmtNum(cl)}</td></tr>`).join('') + `</tbody></table></div>${dLegend()}
    <p class="muted small">En rojo, anotaciones negativas que superan en un 50 % la media de la clase.</p></div>`;
  return h;
}

    h += `<div class="charts">` + gs.map((g, i) => { const m = mean(g.map(x => x.a));

        g.slice().sort((a,b)=>b.a-a.a).map(x => `<div class="it"><span class="chip ${x.tier==='Alto'?'p':x.tier==='Bajo'?'n':'z'}" style="min-width:58px;text-align:center">${x.tier}</span><b style="flex:1">${esc(x.p.s.name)}</b>${x.flag?'<span class="chip n">⚠︎</span>':''}<span class="small muted">${x.lvRaw!=null?fmtNum(x.lvRaw):'s/d'}</span></div>`).join('') +
        `</div></div>`; }).join('') + `</div>`;

}
function groupProfiles(D){
  const P = ui.pan;
  const raw = D.per.map(p => ({p, lvRaw: P.base === 'glob' ? p.glob : p.lv[P.base]}));
  const known = raw.filter(x => x.lvRaw != null).map(x => x.lvRaw), cm = mean(known) ?? 2.5;
  const sorted = raw.map(x => x.lvRaw ?? cm).sort((a,b)=>a-b);
  const t1 = sorted[Math.floor(sorted.length/3)], t2 = sorted[Math.floor(sorted.length*2/3)];
  const negs = D.per.map(p => p.neg).sort((a,b)=>b-a), flagCut = Math.max(2, negs[Math.floor(negs.length*0.2)] || 0);
  return raw.map(x => { const a = x.lvRaw ?? cm; return {...x, a, tier: a >= t2 ? 'Alto' : a < t1 ? 'Bajo' : 'Medio', flag: x.p.neg >= flagCut}; });
}
// Nº de grupos: preferimos grupos de "size" o "size+1"; si saldrían mayores, grupos de "size-1" o "size"
function groupCount(n, size){
  let k = Math.max(1, Math.floor(n / size));
  if (Math.ceil(n / k) > size + 1) k = Math.ceil(n / size);
  return k;
}
function groupSizesText(n, size){
  const k = groupCount(n, size), base = Math.floor(n / k), extra = n % k;
  return `${k} grupos: ` + (extra ? `${extra} de ${base+1} y ${k-extra} de ${base}` : `${k} de ${base}`);
}
function makeGroups(D){
  const P = ui.pan, prof = groupProfiles(D), n = prof.length;
  const k = groupCount(n, P.size);
  // Reparto en serpiente por nivel
  const ord = prof.slice().sort((a,b) => b.a - a.a);
  const G = Array.from({length:k}, () => []);
  ord.forEach((x, i) => { const r = Math.floor(i / k), c = i % k; G[r % 2 ? k-1-c : c].push(x); });
  let seed = (P.seed = (P.seed || 1) + 7919);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cm = mean(prof.map(x => x.a));
  const cost = gs => gs.reduce((s, g) => { const m = mean(g.map(x=>x.a)), fl = g.filter(x=>x.flag).length;
    const tiers = new Set(g.map(x=>x.tier)).size;
    return s + (m - cm)**2 * 12 + Math.max(0, fl-1) * 25 + (3 - tiers) * 2; }, 0);
  // Mejora por intercambios: acepta mejoras (y alguna vez un empeoramiento para no atascarse) y guarda la mejor solución
  let cur = cost(G), best = cur, bestG = G.map(g => g.slice());
  for (let it = 0; it < 6000; it++){
    const a = Math.floor(rnd()*k), b = Math.floor(rnd()*k); if (a === b) continue;
    const i = Math.floor(rnd()*G[a].length), j = Math.floor(rnd()*G[b].length);
    [G[a][i], G[b][j]] = [G[b][j], G[a][i]];
    const c = cost(G);
    if (c <= cur || rnd() < 0.01) { cur = c; if (c < best) { best = c; bestG = G.map(g => g.slice()); } }
    else [G[a][i], G[b][j]] = [G[b][j], G[a][i]];
  }
  P.groups = bestG.map(g => g.map(x => x.p.s.id));
}

function cfgHorario(){
  const slots = [...new Set(state.schedule.map(s=>s.start+'|'+s.end))].sort();
  let h = `<div class="card"><p class="ink2 small" style="margin-top:0">Con el horario, al abrir la aplicación ya aparece el grupo y la materia de la sesión en curso. Toca una sesión para editarla.</p>`;
  if (!slots.length) h += `<p class="muted">Aún no hay sesiones.</p>`;
  else {
    h += `<div style="overflow:auto"><table class="sched"><thead><tr><th></th>${[1,2,3,4,5].map(d=>`<th>${DAYS[d]}</th>`).join('')}</tr></thead><tbody>` +
      slots.map(sl => { const [a,b] = sl.split('|');
        return `<tr><th class="small" style="white-space:nowrap">${a}<br>${b}</th>` + [1,2,3,4,5].map(d => `<td>` +
          state.schedule.filter(s=>s.day===d && s.start===a && s.end===b).map(s => { const m = byId(state.subjects,s.subjectId)||{}, g = byId(state.groups,s.groupId)||{};
            return `<button class="ss" style="background:${m.color||'#888'};color:${inkOn(m.color||'#888')}" data-a="editSess" data-id="${s.id}"><b>${esc(m.name||'?')}</b><br>${esc(g.name||'?')}</button>`; }).join('') + `</td>`).join('') + `</tr>`; }).join('') +
      `</tbody></table></div>`;
  }
  h += `</div>` + sessForm();
  return h;
}

// ---------- Modal, toast y tooltip ----------
function showModal(html){ $('#modalBox').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); $('#modalBox').innerHTML = ''; }
let toastTimer = null;
function toast(msg, btns=[]){
  $('#toastMsg').textContent = msg;
  $('#toastBtns').innerHTML = btns.map(([l,a])=>`<button data-a="${a}">${l}</button>`).join(' ');
  $('#toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, btns.length ? 6000 : 2200);
}
function hideToast(){ $('#toast').classList.remove('show'); }
function showTip(el, x, y){
  const tip = $('#tip'); tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block';
  const w = tip.offsetWidth, hgt = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w/2)) + 'px';
  tip.style.top = Math.max(8, y - hgt - 14) + 'px';
}
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest && e.target.closest('[data-tip]');
  el ? showTip(el, e.clientX, e.clientY) : ($('#tip').style.display = 'none');
});
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  const el = e.target.closest && e.target.closest('[data-tip]');
  el ? showTip(el, e.clientX, e.clientY) : ($('#tip').style.display = 'none');
});

// ---------- Delegación de eventos ----------
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const fn = A[t.dataset.a]; if (fn) fn(t, e);
});
document.addEventListener('change', e => { const t = e.target.closest('[data-c]'); if (t && C[t.dataset.c]) C[t.dataset.c](t, e); });
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.i === 'note') ui.note = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newGroup') A.addGroup();
  if (e.key === 'Enter' && e.target.id === 'newSubj') A.addSubj();
  if (e.key === 'Escape') closeModal();
});

// ---------- Copias de seguridad y exportación ----------
async function saveFile(name, blob){
  try {
    const file = new File([blob], name, {type: blob.type});
    if (navigator.canShare && navigator.canShare({files:[file]}) && /iPad|iPhone|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
      await navigator.share({files:[file], title:name}); return true;
    }
  } catch (err) { if (err && err.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
async function doBackup(){
  const data = {app:'RegistrAula', version:1, date:new Date().toISOString(), state, records};
  const ok = await saveFile(`RegistrAula_copia_${ymd(new Date())}.json`, new Blob([JSON.stringify(data)], {type:'application/json'}));
  if (ok) { state.lastBackup = Date.now(); saveState(); toast('Copia de seguridad creada'); rerender(); }
}

function pickFile(mode){ ui.fileMode = mode; $('#fileIn').value = ''; $('#fileIn').click(); }
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { alert('El archivo no se puede leer: ' + err.message); return; }
  try {
    if (ui.fileMode === 'curric') {
      if (data.app !== 'RegistrAula' || data.type !== 'curriculo') throw new Error('No es un archivo de currículo de RegistrAula');
      const r = importCurric(data); closeModal(); toast(r); rerender(); return;
    }
    if (data.app !== 'RegistrAula' || !data.state || !Array.isArray(data.records)) throw new Error('No es una copia ni un archivo de sincronización de RegistrAula');
    if (ui.fileMode === 'sync') {
      const r = await mergeData(data);
      state.syncInfo = Object.assign({}, state.syncInfo, {lastIn: Date.now(), from: data.device || 'otro dispositivo'}); await saveState(true);
      closeModal(); toast(`Fusionado: ${r.added} nuevos, ${r.updated} actualizados, ${r.removed} borrados`); render(); return;
    }
    if (!confirm(`La copia es del ${new Date(data.date).toLocaleString('es-ES')} y tiene ${data.records.length} registros.\nSe REEMPLAZARÁN todos los datos actuales de esta tablet. ¿Continuar?\n\n(Si quieres juntar datos de dos dispositivos, usa "Sincronizar" en lugar de restaurar.)`)) return;
    await tx('records','readwrite', s => s.clear());
