async function mergeData(data){
  const rs = migrate(JSON.parse(JSON.stringify(data.state))), rt = rs.tomb || {}, lt = state.tomb;
  // Dispositivo recién estrenado (sin grupos ni registros): adopta los datos del otro tal cual, sin duplicar materias ni anotaciones
  if (!records.length && !state.groups.length){
    const keep = {device: state.prefs.device, deselect: state.prefs.deselect};
    state = rs; state.prefs = Object.assign({}, rs.prefs, keep);
    records = data.records.slice().sort((a,b) => a.ts - b.ts);
    await tx('records','readwrite', st => st.clear()); await putRecords(records, true);
    buildSnap(); await saveState(true);
    return {added: records.length, updated: 0, removed: 0};
  }
  let added = 0, updated = 0, removed = 0;
  COLLS.forEach(c => {
    const loc = state[c] || (state[c] = []), m = new Map(loc.map(e => [e.id, e]));
    (rs[c] || []).forEach(re => {
      const ru = re._u || 0, le = m.get(re.id);
      if (lt[re.id] && lt[re.id] >= ru) return;               // lo borré yo después
      if (!le) { loc.push(re); m.set(re.id, re); added++; }
      else if (ru > (le._u || 0)) { Object.keys(le).forEach(k => delete le[k]); Object.assign(le, re); updated++; }
    });
  });
  Object.entries(rt).forEach(([id, ts]) => {
    COLLS.forEach(c => { const i = state[c].findIndex(e => e.id === id); if (i >= 0 && (state[c][i]._u || 0) <= ts) { state[c].splice(i, 1); removed++; } });
    if (!lt[id] || lt[id] < ts) lt[id] = ts;
  });
  const rm = new Map(records.map(r => [r.id, r])), put = [], del = [];
  data.records.forEach(rr => {
    const ru = rr._u || rr.ts || 0, lr = rm.get(rr.id);
    if (lt[rr.id] && lt[rr.id] >= ru) return;
    if (!lr) { records.push(rr); rm.set(rr.id, rr); put.push(rr); added++; }
    else if (ru > (lr._u || lr.ts || 0)) { Object.assign(lr, rr); put.push(lr); updated++; }
  });
  Object.entries(rt).forEach(([id, ts]) => { const lr = rm.get(id); if (lr && (lr._u || lr.ts || 0) <= ts) del.push(id); });
  if (del.length) { const d = new Set(del); records = records.filter(r => !d.has(r.id)); removed += del.length; await rawDel(del); }
  records.sort((a,b) => a.ts - b.ts);
  if (put.length) await putRecords(put, true);
  buildSnap(); await saveState(true);
  const dd = await dedupeByName();
  return {added, updated, removed: removed + dd};
}

// ---------- Fusionar materias y anotaciones repetidas (mismo nombre) ----------
// Se queda siempre con el id menor, así todos los dispositivos llegan al mismo resultado al sincronizar.
async function dedupeByName(){
  const key = x => String(x||'').trim().toLowerCase();
  const remapS = {}, remapI = {};
  const bySubj = {};
  state.subjects.forEach(s => (bySubj[key(s.name)] || (bySubj[key(s.name)] = [])).push(s));
  Object.values(bySubj).forEach(arr => { if (arr.length < 2) return; arr.sort((a,b) => a.id < b.id ? -1 : 1); arr.slice(1).forEach(x => remapS[x.id] = arr[0].id); });
  const rs = id => remapS[id] || id;
  if (Object.keys(remapS).length){
    state.subjects = state.subjects.filter(s => !remapS[s.id]);
    state.competencias.forEach(c => c.subjectId = rs(c.subjectId));
    state.tareas.forEach(t => t.subjectId = rs(t.subjectId));
    state.schedule.forEach(x => x.subjectId = rs(x.subjectId));
    state.plan.forEach(p => p.subj = rs(p.subj));
    state.indicators.forEach(i => { if (i.subjectId !== '*') i.subjectId = rs(i.subjectId); });
  }
  // competencias repetidas (misma materia y código): se juntan sus criterios
  const remapC = {}, byComp = {};
  state.competencias.forEach(c => (byComp[c.subjectId+'|'+key(c.code)] || (byComp[c.subjectId+'|'+key(c.code)] = [])).push(c));
  Object.values(byComp).forEach(arr => { if (arr.length < 2) return; arr.sort((a,b) => a.id < b.id ? -1 : 1); arr.slice(1).forEach(x => remapC[x.id] = arr[0].id); });
  if (Object.keys(remapC).length){
    state.competencias = state.competencias.filter(c => !remapC[c.id]);
    state.criterios.forEach(k => { if (remapC[k.compId]) k.compId = remapC[k.compId]; });
    state.tareas.forEach(t => t.compIds = [...new Set((t.compIds||[]).map(id => remapC[id] || id))]);
  }
  // criterios repetidos (misma competencia, código y niveles)
  const remapK = {}, byCrit = {};
  state.criterios.forEach(k => { const kk = k.compId+'|'+key(k.code)+'|'+(k.levels||[]).slice().sort().join(','); (byCrit[kk] || (byCrit[kk] = [])).push(k); });
  Object.values(byCrit).forEach(arr => { if (arr.length < 2) return; arr.sort((a,b) => a.id < b.id ? -1 : 1); arr.slice(1).forEach(x => remapK[x.id] = arr[0].id); });
  if (Object.keys(remapK).length){
    state.criterios = state.criterios.filter(k => !remapK[k.id]);
    state.tareas.forEach(t => t.critIds = [...new Set((t.critIds||[]).map(id => remapK[id] || id))]);
  }
  // tareas repetidas (misma materia y nombre)
  const remapT = {}, byTask = {};
  state.tareas.forEach(t => (byTask[t.subjectId+'|'+key(t.name)] || (byTask[t.subjectId+'|'+key(t.name)] = [])).push(t));
  Object.values(byTask).forEach(arr => { if (arr.length < 2) return; arr.sort((a,b) => a.id < b.id ? -1 : 1); arr.slice(1).forEach(x => remapT[x.id] = arr[0].id); });
  if (Object.keys(remapT).length){
    state.tareas = state.tareas.filter(t => !remapT[t.id]);
    state.plan.forEach(p => p.taskIds = [...new Set(p.taskIds.map(id => remapT[id] || id))]);
  }
  // anotaciones estándar repetidas
  const byInd = {};
  state.indicators.forEach(i => { const kk = [key(i.name), i.subjectId, i.cat, i.mode, i.v].join('|'); (byInd[kk] || (byInd[kk] = [])).push(i); });
  Object.values(byInd).forEach(arr => { if (arr.length < 2) return; arr.sort((a,b) => a.id < b.id ? -1 : 1); arr.slice(1).forEach(x => remapI[x.id] = arr[0].id); });
  if (Object.keys(remapI).length) state.indicators = state.indicators.filter(i => !remapI[i.id]);
  // sesiones de horario repetidas
  const seenS = new Set(); state.schedule = state.schedule.filter(x => { const k = [x.day,x.start,x.end,x.groupId,x.subjectId].join('|'); if (seenS.has(k)) return false; seenS.add(k); return true; });
  const n = Object.keys(remapS).length + Object.keys(remapC).length + Object.keys(remapK).length + Object.keys(remapT).length + Object.keys(remapI).length;
  // registros que apuntaban a lo fusionado
  const upd = [];
  records.forEach(r => { let ch = false;
    if (remapS[r.subj]) { r.subj = remapS[r.subj]; ch = true; }
    if (r.ind && remapI[r.ind]) { r.ind = remapI[r.ind]; ch = true; }
    if (r.task && remapT[r.task]) { r.task = remapT[r.task]; ch = true; }
    if ((r.comp||[]).some(id => remapC[id])) { r.comp = [...new Set(r.comp.map(id => remapC[id] || id))]; ch = true; }
    if ((r.crit||[]).some(id => remapK[id])) { r.crit = [...new Set(r.crit.map(id => remapK[id] || id))]; ch = true; }
    if (ch) upd.push(r); });
  if (upd.length) await putRecords(upd);
  if (n || upd.length) await saveState();
  return n;
}

// Fusiona un currículo: no borra nada; coincide materias por nombre, competencias por código, criterios por código y nivel, tareas por nombre
function importCurric(data){
  const norm_ = x => String(x||'').trim().toLowerCase();
  const lvKey = a => (a||[]).slice().sort().join(',');
  const mapS = {}, mapC = {}, mapK = {}; let n = {s:0, c:0, k:0, t:0, u:0};
  (data.subjects||[]).forEach(rs => {
    let s = state.subjects.find(x => norm_(x.name) === norm_(rs.name));
    if (!s) { s = {id:uid(), name:rs.name, color: rs.color || PALETTE[state.subjects.length % PALETTE.length]}; state.subjects.push(s); n.s++; }
    mapS[rs.ref] = s.id;
  });
  (data.competencias||[]).forEach(rc => {
    const sid = mapS[rc.subject]; if (!sid) return;
    let c = state.competencias.find(x => x.subjectId === sid && norm_(x.code) === norm_(rc.code));
    if (!c) { c = {id:uid(), subjectId:sid, code:rc.code, text:rc.text}; state.competencias.push(c); n.c++; }
    else if (c.text !== rc.text) { c.text = rc.text; n.u++; }
    mapC[rc.ref] = c.id;
  });
  (data.criterios||[]).forEach(rk => {
    const cid = mapC[rk.comp]; if (!cid) return;
    let k = state.criterios.find(x => x.compId === cid && norm_(x.code) === norm_(rk.code) && lvKey(x.levels) === lvKey(rk.levels));
    if (!k) { k = {id:uid(), compId:cid, code:rk.code, text:rk.text, levels:rk.levels||[]}; state.criterios.push(k); n.k++; }
    else if (k.text !== rk.text) { k.text = rk.text; n.u++; }
    mapK[rk.ref] = k.id;
  });
  (data.tareas||[]).forEach(rt => {
    const sid = mapS[rt.subject]; if (!sid) return;
    const links = {compIds:(rt.comps||[]).map(r=>mapC[r]).filter(Boolean), critIds:(rt.crits||[]).map(r=>mapK[r]).filter(Boolean), levels:rt.levels||[], desc:rt.desc||''};
    const t = state.tareas.find(x => x.subjectId === sid && norm_(x.name) === norm_(rt.name));
    if (!t) { state.tareas.push({id:uid(), subjectId:sid, name:rt.name, active:true, ...links}); n.t++; }
    else { Object.assign(t, links); n.u++; }
  });
  saveState();
  dedupeByName();
  return `Currículo importado: ${n.c} competencias, ${n.k} criterios y ${n.t} tareas nuevas${n.u?`, ${n.u} actualizadas`:''}${n.s?`, ${n.s} materias nuevas`:''}.`;
}

function loadDemo(){
  const names = ['Lucía García','Hugo Martínez','Martina López','Leo Sánchez','Sofía Pérez','Mateo Gómez','Valeria Ruiz','Daniel Díaz','Paula Moreno','Álvaro Muñoz',
    'Julia Álvarez','Pablo Romero','Emma Navarro','Adrián Torres','Carla Domínguez','Marcos Vázquez','Alba Ramos','Izan Gil','Noa Serrano','Bruno Molina','Vega Blanco','Gael Ortiz'];
  const g = {id:uid(), name:'1.º A (ejemplo)', demo:true};
  state.groups.push(g);
  const studs = names.map(n => ({id:uid(), groupId:g.id, name:n, active:true}));
  state.students.push(...studs);
  const S = n => (state.subjects.find(s=>s.name===n) || state.subjects[0]).id;
  const plan = [
    ['09:00','09:45',['Lengua Castellana','Matemáticas','Lengua Castellana','Matemáticas','Inglés']],
    ['09:45','10:30',['Matemáticas','Lengua Castellana','Valencià','Lengua Castellana','Matemáticas']],
    ['10:30','11:15',['Conocimiento del Medio','Inglés','Matemáticas','Educación Física','Valencià']],
    ['11:45','12:30',['Valencià','Educación Artística','Conocimiento del Medio','Inglés','Tutoría']],
    ['15:00','16:30',['Educación Física','Religión / At. Educativa','Educación Artística','Conocimiento del Medio','Lengua Castellana']]
  ];
  const demoSched = [];
  plan.forEach(([a,b,subs]) => subs.forEach((n,i) => demoSched.push({id:uid(), day:i+1, start:a, end:b, groupId:g.id, subjectId:S(n)})));
  if (!state.schedule.length) state.schedule.push(...demoSched);
  // Perfiles: algunos con más conducta negativa, uno que mejora, otros "invisibles"
  const profile = studs.map((s,i) => ({neg: i===1?0.55 : i===5?0.45 : i===12?0.35 : 0.12, improve: i===1, weight: (i===17||i===20)?0.15:1, skill: 0.35 + ((i*37)%60)/100}));
  const rnd = (() => { let x = 12345; return () => (x = (x*16807) % 2147483647) / 2147483647; })();
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const neg = state.indicators.filter(i=>i.mode==='count' && i.v<0 && i.subjectId==='*');
  const pos = state.indicators.filter(i=>i.mode==='count' && i.v>0 && i.subjectId==='*');
  const recs = []; const today = new Date();
  for (let back = 35; back >= 0; back--){
    const day = new Date(today.getFullYear(), today.getMonth(), today.getDate()-back);
    if (day.getDay() === 0 || day.getDay() === 6) continue;
    const progress = 1 - back/35;
    demoSched.filter(s=>s.day===day.getDay()).forEach(sess => {
      const [h,m] = sess.start.split(':').map(Number);
      const scoreInds = state.indicators.filter(i=>i.mode==='score' && (i.subjectId==='*'||i.subjectId===sess.subjectId));
      const n = 3 + Math.floor(rnd()*5);
      for (let k=0; k<n; k++){
        let si; do { si = Math.floor(rnd()*studs.length); } while (rnd() > profile[si].weight);
        const p = profile[si], s = studs[si];
        const ts = new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, m + 5 + Math.floor(rnd()*35)).getTime();
        const negP = p.improve ? p.neg * (1.2 - progress) : p.neg;
        let ind, val = null;
        const roll = rnd();
        if (roll < 0.4 && scoreInds.length){ ind = pick(scoreInds);
          const lvl = Math.min(1, Math.max(0, p.skill + (p.improve?progress*0.3:0) + (rnd()-0.5)*0.35));
          val = Math.round(ind.min + lvl*(ind.max-ind.min)); }
        else if (roll < 0.4 + negP*0.6) ind = pick(neg);
        else ind = pick(pos);
        if (ts > Date.now()) continue;
        recs.push({id:uid(), ts, sid:s.id, gid:g.id, subj:sess.subjectId, ind:ind.id, name:ind.name, cat:ind.cat, area:AREA[ind.cat],
          v: ind.mode==='score'?0:ind.v, mode:ind.mode, val, min:ind.min, max:ind.max,
          note: rnd() < 0.06 ? pick(['Tras el recreo, muy alterado.','Lo resuelve solo tras una pista.','Se calma con la mesa de la calma.','Explica su estrategia al grupo.','Llega tarde a la sesión.']) : ''});
      }
    });
  }
  // Currículo, tareas y planes de ejemplo (Matemáticas)
  const mat = S('Matemáticas');
  if (!state.competencias.some(c => c.subjectId === mat)){
    const C = (code, text) => { const c = {id:uid(), subjectId:mat, code, text, demo:true}; state.competencias.push(c); return c; };
    const K = (c, code, text) => { const k = {id:uid(), compId:c.id, code, text, demo:true}; state.criterios.push(k); return k; };
    const c1 = C('CE1','(Ejemplo) Resolver situaciones problemáticas de la vida cotidiana.');
    const k11 = K(c1,'1.1','(Ejemplo) Comprende el enunciado e identifica los datos.'), k12 = K(c1,'1.2','(Ejemplo) Aplica una estrategia de resolución adecuada.');
    const c2 = C('CE2','(Ejemplo) Utilizar el cálculo y el sentido numérico.');
    const k21 = K(c2,'2.1','(Ejemplo) Suma y resta con agilidad.'), k22 = K(c2,'2.2','(Ejemplo) Estima resultados y los comprueba.');
    const c3 = C('CE3','(Ejemplo) Comunicar el proceso seguido.');
    const k31 = K(c3,'3.1','(Ejemplo) Explica oralmente cómo ha resuelto.');
    const T = (name, critIds) => { const t = {id:uid(), subjectId:mat, name, desc:'', compIds:[], critIds, active:true, demo:true}; state.tareas.push(t); return t; };
    const tks = [T('Problemas de sumas', [k11.id,k12.id,k31.id]), T('Cálculo mental en parejas', [k21.id]),
                 T('Estimación con regletas', [k22.id,k12.id]), T('Explica tu estrategia', [k31.id])];
    let ti = 0;
    for (let back = 35; back >= 0; back--){
      const day = new Date(today.getFullYear(), today.getMonth(), today.getDate()-back);
      demoSched.filter(x => x.subjectId === mat && x.day === day.getDay()).forEach(sess => {
        const date = ymd(day), ids = [tks[ti % 4].id, tks[(ti+1) % 4].id]; ti++;
        state.plan.push({id:uid(), date, gid:g.id, subj:mat, start:sess.start, taskIds:ids, demo:true});
        if (back === 0) return;   // la sesión de hoy queda pendiente de evaluar
        const [h,m] = sess.start.split(':').map(Number);
        ids.forEach(tid => { const t = byId(state.tareas, tid), prog = 1 - back/35;
          studs.forEach((st, si) => { if (rnd() < 0.15) return;
            const p = profile[si], lvl = p.skill + (p.improve ? prog*0.35 : prog*0.1) + (rnd()-0.5)*0.4;
            const val = rnd() < 0.05 ? null : Math.min(4, Math.max(1, Math.round(1 + lvl*3)));
            recs.push({id:uid(), ts:new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, m+10+Math.floor(rnd()*30)).getTime(), date, sid:st.id, gid:g.id, subj:mat,
              task:tid, name:t.name, cat:'Evaluación', area:'A', v:0, mode:'score', val, min:1, max:4, nr:val==null, comp:taskComps(t), crit:t.critIds.slice(), note:''});
          }); });
      });
    }
  }
  records.push(...recs); records.sort((a,b)=>a.ts-b.ts);
  putRecords(recs); saveState();
  ui.cfg.gid = g.id; ui.rep.gid = g.id; ui.hist.gid = g.id; ui.manual = null; ui.last = {gid:g.id, subj:S('Matemáticas')};
  toast(`Ejemplo cargado: ${studs.length} alumnos y ${recs.length} registros`); render();
}

// ---------- Arranque ----------
const VIEWS = {aula:viewAula, plan:viewPlan, panel:viewPanel, historial:viewHistorial, informes:viewInformes, ajustes:viewAjustes};
(async function init(){
  try { await loadAll(); }
  catch (err) { $('#main').innerHTML = `<div class="wrap"><div class="card empty">No se puede acceder al almacenamiento de este navegador (${esc(err.message||err)}).<br>En iPad, abre la app desde Safari normal (no en modo privado).</div></div>`; return; }
  tickClock(); render();
  setInterval(() => {
    tickClock();
    if (ui.view === 'aula' && !(ui.manual && ui.manual.pinned) && !$('#modal').classList.contains('show') && document.activeElement?.dataset?.i !== 'note' && currentContext().key !== ui.ctxKey) {
      ui.sel.clear(); ui.pending = null; ui.manual = null; ui.evalMode = 'alumno'; render();
    }
  }, 20000);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
